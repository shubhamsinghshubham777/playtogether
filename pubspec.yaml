name: playtogether
description: "A simple shared media player for all your favorite platforms (powered by Flutter)."
publish_to: 'none'
version: 0.5.0

environment:
  sdk: 3.12.2

dependencies:
  app_links: 7.2.1
  collection: 1.19.1
  fast_file_picker: 0.4.8
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_dotenv: 6.0.0
  flutter_inappwebview: 6.1.5
  go_router: 17.3.0
  image: 4.9.1
  livekit_client: 2.8.1
  material_symbols_icons: 4.2960.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  responsive_framework: 1.5.1
  supabase_flutter: 2.16.0
  uuid: 4.6.0
  window_manager: 0.5.2
  youtube_player_flutter: 9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  inno_bundle: 0.11.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/subfont.ttf
    # Generated by tool/generate_splash_sound.py — see the splash notes in CLAUDE.md.
    - assets/sfx/splash.wav
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-300.ttf
          weight: 300
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500

inno_bundle:
  id: a05680d0-e422-11f0-af00-4b68febb008b
  publisher: Shubham Singh
  languages:
    - english

# Regenerate with: fvm dart run flutter_launcher_icons
# Source art in assets/icon/ is built by tool/generate_app_icon.py from the
# in-app wordmark logo — edit that script, not the PNGs.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  # The foreground/monochrome art is full-bleed on purpose — flutter_launcher_icons
  # wraps both in its own 16% adaptive-icon safe-zone inset.
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  ios: true
  # iOS and macOS 26+ round the corners themselves, so both take square
  # full-bleed art — padding or alpha makes macOS 26 fall back to its default
  # grey icon container.
  image_path_ios: assets/icon/app_icon_square.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon_square.png
  # Windows is deliberately off: flutter_launcher_icons writes a single 256px
  # frame, so tool/generate_app_icon.py owns app_icon.ico and gives it the
  # 16/24/32/48 frames the taskbar and Inno Setup installer actually use.
  windows:
    generate: false
