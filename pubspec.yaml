name: playtogether
description: "A simple shared media player for all your favorite platforms (powered by Flutter)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  fvp: ^0.35.1
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/subfont.ttf
