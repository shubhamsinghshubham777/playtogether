name: playtogether
description: "A simple shared media player for all your favorite platforms (powered by Flutter)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  fast_file_picker: ^0.4.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/subfont.ttf
