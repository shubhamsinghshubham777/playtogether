name: Build App Installers
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: >-
          Markdown "What's Changed" section for the release body (include the
          heading). Shown above the Downloads section; empty keeps the old
          downloads-only body.
        type: string
        required: false
        default: ""
      prerelease:
        description: >-
          Publish the GitHub release as a pre-release (marked with the
          Pre-release badge and excluded from "Latest").
        type: boolean
        required: false
        default: false
permissions:
  contents: read

# Cancel previous runs when a new commit is pushed. The called workflows carry
# their own platform-suffixed groups, so they don't collide with this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The per-platform build logic lives in the same workflows that can be
  # dispatched on their own — this workflow only fans out and releases.
  windows:
    uses: ./.github/workflows/build_windows.yaml
    secrets: inherit

  macos:
    uses: ./.github/workflows/build_macos.yaml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: [ windows, macos ]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact_name }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos.outputs.artifact_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ./PlayTogether-${{ needs.windows.outputs.app_version }}-Windows.exe
            ./PlayTogether-${{ needs.macos.outputs.app_version }}-macOS.dmg
          name: "v${{ needs.windows.outputs.app_version }}"
          target_commitish: "${{ github.sha }}"
          tag_name: "v${{ needs.windows.outputs.app_version }}_${{ github.run_id }}"
          body: |
            ${{ inputs.release_notes }}

            ## Downloads
            - **Windows**: `PlayTogether-${{ needs.windows.outputs.app_version }}-Windows.exe`
            - **macOS**: `PlayTogether-${{ needs.macos.outputs.app_version }}-macOS.dmg`

            ## macOS Installation Notes
            This build is unsigned. To run the app:
            1. Open the DMG and drag PlayTogether to Applications
            2. Right-click the app and select "Open" (first time only)
            3. Or run: `xattr -cr /Applications/PlayTogether.app`
