name: Build App Installer (Windows)
on:
  workflow_dispatch:
  # Called by build_installers.yaml. Keep this workflow self-contained (it
  # computes its own version and names its own artifact) so dispatching it
  # directly produces exactly what the release job would consume.
  workflow_call:
    outputs:
      app_version:
        description: Version from pubspec.yaml, e.g. 0.4.0
        value: ${{ jobs.windows-installer.outputs.app_version }}
      artifact_name:
        description: Name of the uploaded artifact
        value: windows-installer
permissions:
  contents: read

# Cancel previous runs when a new commit is pushed. The platform suffix is
# load-bearing: when called from build_installers.yaml, `github.workflow`
# resolves to the *caller's* name, so without it the windows and macos jobs
# would share one cancel-in-progress group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-windows
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true  # Enable caching for Flutter SDK and pub dependencies

      # The expensive translation units here belong to plugins (inappwebview,
      # flutter_webrtc), and those sources live in the pub cache, which
      # flutter-action restores with their original mtimes — so MSBuild's
      # timestamp check accepts the cached .obj files instead of rebuilding them.
      # Deliberately no restore-keys: a prefix hit would pair objects with a
      # different set of plugin versions, and a subtly stale installer is a worse
      # outcome than a slow one. A pubspec.lock change simply pays full price.
      # Measured on a 2-core runner: 676s cold, 89s warm, ~6s to restore. Note
      # that Actions caches do not travel from a branch to main — only main's own
      # caches are visible everywhere — so the first run after a change here, and
      # after every dependency bump, is a cold one.
      - name: Cache Windows build outputs
        uses: actions/cache@v4
        with:
          path: build/windows
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('pubspec.lock') }}

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash  # runner default is pwsh; this needs grep/cut
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" | Out-File -FilePath .env -Encoding utf8

      # `flutter clean` used to sit between two `pub get`s here, which meant the
      # first one only ever produced a .dart_tool for clean to delete. The runner
      # is a fresh checkout, so there is nothing to clean in the first place.
      - name: Install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      # flutter_webrtc's third_party/CMakeLists.txt downloads libwebrtc.zip and
      # extracts it into its own package dir — which the Windows build reaches
      # through windows/flutter/ephemeral/.plugin_symlinks/flutter_webrtc.
      # Recent CMake (bundled with Visual Studio, so not pinnable here) refuses
      # to extract through a symlink. Its guard skips the download+extract when
      # both the zip and third_party/libwebrtc already exist, so we do the
      # extraction ourselves against the real pub-cache path.
      - name: Pre-extract libwebrtc
        run: ./.github/scripts/preextract-libwebrtc.ps1

      - name: Build Windows App
        run: flutter build windows --release

      - name: Build iss script
        run: dart run inno_bundle --no-app --release --no-installer

      # Adds the synctogether:// protocol handler (OAuth callbacks) and the
      # WebView2 runtime (guest captcha) — neither is expressible in the
      # inno_bundle config, and it rewrites the script on every build.
      - name: Patch installer script
        run: ./.github/scripts/patch-installer-script.ps1

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ./build/windows/x64/installer/Release/inno-script.iss

      - name: Rename installer
        run: |
          mv "./build/windows/x64/installer/Release/SyncTogether-x86_64-${{ steps.version.outputs.APP_VERSION }}-Installer.exe" "./SyncTogether-${{ steps.version.outputs.APP_VERSION }}-Windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ./SyncTogether-${{ steps.version.outputs.APP_VERSION }}-Windows.exe
