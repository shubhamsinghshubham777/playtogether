name: Build App Installer (macOS)
on:
  workflow_dispatch:
  # Called by build_installers.yaml. Keep this workflow self-contained (it
  # computes its own version and names its own artifact) so dispatching it
  # directly produces exactly what the release job would consume.
  workflow_call:
    outputs:
      app_version:
        description: Version from pubspec.yaml, e.g. 0.4.0
        value: ${{ jobs.macos-dmg.outputs.app_version }}
      artifact_name:
        description: Name of the uploaded artifact
        value: macos-dmg
      ed_signature:
        description: Sparkle EdDSA signature of the DMG, for the appcast enclosure
        value: ${{ jobs.macos-dmg.outputs.ed_signature }}
      dmg_length:
        description: Byte length of the DMG, for the appcast enclosure
        value: ${{ jobs.macos-dmg.outputs.dmg_length }}
permissions:
  contents: read

# Cancel previous runs when a new commit is pushed. The platform suffix is
# load-bearing: when called from build_installers.yaml, `github.workflow`
# resolves to the *caller's* name, so without it the windows and macos jobs
# would share one cancel-in-progress group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-macos
  cancel-in-progress: true

jobs:
  macos-dmg:
    runs-on: macos-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      ed_signature: ${{ steps.sign.outputs.ED_SIGNATURE }}
      dmg_length: ${{ steps.sign.outputs.DMG_LENGTH }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache Flutter build outputs
        uses: actions/cache@v4
        with:
          # macos/Pods is cached so that `flutter build` finds Manifest.lock
          # already matching Podfile.lock and skips CocoaPods entirely. That is
          # the point of caching it: `pod install` rewrites Pods.xcodeproj and
          # the Target Support Files on every run, which invalidates each pod
          # target in Xcode. media_kit, inappwebview and flutter_webrtc were
          # recompiling on top of a perfectly warm cache because of it — worth
          # 77s of the build step.
          #
          # The key is versioned because a change to what gets cached is inert
          # while an older cache still satisfies the key: on an exact hit the
          # action never re-saves.
          path: |
            build/macos
            macos/Pods
            .dart_tool
          key: ${{ runner.os }}-flutter-build-v3-${{ hashFiles('**/pubspec.lock', 'macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Install dependencies
        run: flutter pub get

      # No explicit `pod install`: flutter runs CocoaPods itself when Podfile.lock
      # and the pods' Manifest.lock disagree, and skips it when they agree. Doing
      # it unconditionally is what dirtied every pod target on every build.
      - name: Build macOS App
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      # This used to be create-dmg, which spent ~50s mounting a scratch image and
      # driving Finder over AppleScript to place two icons and size the window —
      # all of which it then persisted into the volume's .DS_Store. macos/dmg/
      # dmg_ds_store IS that file, lifted out of the shipped v0.7.0 DMG, so
      # staging it reproduces the same window with Finder never involved.
      # Regenerate it (mount a DMG, copy .DS_Store) if the layout should change;
      # the icon positions inside it are keyed to these exact filenames.
      - name: Create DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # ditto, not cp -R: it preserves the extended attributes and resource
          # forks that the release build's ad-hoc code signature depends on.
          ditto "build/macos/Build/Products/Release/SyncTogether.app" "$STAGE/SyncTogether.app"
          ln -s /Applications "$STAGE/Applications"
          cp macos/dmg/dmg_ds_store "$STAGE/.DS_Store"
          # zlib-level=9 is what create-dmg asked for. The hdiutil default is
          # ~15s faster to write and ~6 MB larger to download, which is the wrong
          # way round for something every user fetches once.
          hdiutil create \
            -volname "SyncTogether" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-macOS.dmg"

      - name: Sign the DMG for Sparkle
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DMG="SyncTogether-${{ steps.version.outputs.APP_VERSION }}-macOS.dmg"
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is unset — installed copies could not verify this update."
            exit 1
          fi
          SIGNED=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | macos/Pods/Sparkle/bin/sign_update --ed-key-file - "$DMG")
          SIG=$(printf '%s' "$SIGNED" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          LEN=$(printf '%s' "$SIGNED" | sed -n 's/.*length="\([0-9][0-9]*\)".*/\1/p')
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then
            echo "::error::sign_update returned no signature for $DMG"
            exit 1
          fi
          echo "ED_SIGNATURE=$SIG" >> "$GITHUB_OUTPUT"
          echo "DMG_LENGTH=$LEN" >> "$GITHUB_OUTPUT"

      # Runs after the DMG is built and before the cache is saved at job end.
      # Excluding these via a `!` pattern on the cache path does not work: when
      # `path:` names a directory it is archived whole, and negations for files
      # inside it are never applied — which is why the "trimmed" cache came out
      # bigger than the one it replaced. FlutterMacOS.framework.dSYM alone is
      # 505 MB of engine debug symbols riding along in a release build.
      - name: Drop debug symbols before the cache is saved
        run: rm -rf build/macos/Build/Products/Release/*.dSYM

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ./SyncTogether-${{ steps.version.outputs.APP_VERSION }}-macOS.dmg
